steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--build-arg", "NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}", "--build-arg", "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}", "--build-arg", "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/studiocopilot:$BUILD_ID", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/studiocopilot:$BUILD_ID"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ["run", "deploy", "studiocopilot", "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/studiocopilot:$BUILD_ID", "--region=${_REGION}", "--platform=managed", "--allow-unauthenticated", "--set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,FIREBASE_AUTH_PROJECT_ID=${_FIREBASE_PROJECT_ID},GOOGLE_CLOUD_LOCATION=global,GEMINI_MODEL=gemini-2.5-pro,STUDIOCOPILOT_DEMO_MODE=false,STUDIOCOPILOT_ALLOWED_EMAILS=${_ALLOWED_EMAILS}", "--set-secrets=PARALLEL_API_KEY=parallel-api-key:latest"]
substitutions:
  _REGION: europe-west2
  _REPOSITORY: studiocopilot
  _FIREBASE_API_KEY: configuration-required
  _FIREBASE_AUTH_DOMAIN: configuration-required.invalid
  _FIREBASE_PROJECT_ID: configuration-required
  _ALLOWED_EMAILS: configuration-required.invalid
options:
  logging: CLOUD_LOGGING_ONLY
